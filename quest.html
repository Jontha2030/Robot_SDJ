<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPV View</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; display: flex; 
               justify-content: center; align-items: center; 
               height: 100vh; flex-direction: column; }
        #stream { width: 100%; max-width: 960px; }
        #status { color: white; font-size: 16px; margin-top: 10px; font-family: sans-serif; }
        #log    { color: yellow; font-size: 12px; margin-top: 10px; font-family: monospace; 
                  max-width: 960px; word-wrap: break-word; }
        #yawDisplay { color: lime; font-size: 24px; margin-top: 10px; font-family: monospace; }
        #startBtn { 
            margin-top: 20px; padding: 15px 30px;
            font-size: 18px; background: #4CAF50; 
            color: white; border: none; border-radius: 8px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img id="stream" src="/video" alt="Camera Feed">
    <div id="status">Head tracking: OFF</div>
    <div id="log">Log: waiting...</div>
    <div id="yawDisplay">Raw yaw: --</div>
    <button id="startBtn" onclick="startTracking()">Start Head Tracking</button>

<script>
    let tracking = false;
    let baseYaw = null;
    let lastSentYaw = null;
    const DEADZONE = 2;

    function log(msg) {
        console.log(msg);
        document.getElementById('log').textContent = 'Log: ' + msg;
    }

    function setStatus(msg) {
        document.getElementById('status').textContent = 'Head tracking: ' + msg;
    }

    function sendYaw(yaw) {
        if (lastSentYaw !== null && Math.abs(yaw - lastSentYaw) < DEADZONE) return;
        lastSentYaw = yaw;

        fetch('/headtracking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ yaw: yaw })
        }).catch(e => log("Send error: " + e.message));
    }

    function handleOrientation(e) {
        // Always show raw value so we can confirm events are firing
        document.getElementById('yawDisplay').textContent =
            'Raw alpha: ' + (e.alpha ? e.alpha.toFixed(1) : 'null');

        if (!tracking) return;

        let raw = e.alpha || 0;

        // Calibrate on first reading
        if (baseYaw === null) {
            baseYaw = raw;
            log("Calibrated at " + raw.toFixed(1) + "° — move your head!");
            return;
        }

        // Relative yaw from starting position
        let yaw = raw - baseYaw;
        if (yaw > 180)  yaw -= 360;
        if (yaw < -180) yaw += 360;

        log("Yaw: " + yaw.toFixed(1) + "°");
        sendYaw(yaw);
    }

    function activateTracking() {
        tracking = true;
        baseYaw = null;
        lastSentYaw = null;

        window.addEventListener('deviceorientation', handleOrientation);
        setStatus("ACTIVE — look straight ahead to calibrate");
        document.getElementById('startBtn').textContent = 'Tracking Active';
        document.getElementById('startBtn').disabled = true;

        // Confirm Pi is reachable
        fetch('/headtracking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ yaw: 0 })
        }).then(r => r.json())
          .then(d => log("Pi connected: " + JSON.stringify(d)))
          .catch(e => log("Pi connection failed: " + e.message));
    }

    function startTracking() {
        log("Requesting sensor permission...");

        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
            // Requires explicit permission (iOS Safari style)
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        activateTracking();
                    } else {
                        log("Sensor permission denied");
                    }
                })
                .catch(e => log("Permission error: " + e.message));
        } else {
            // Android/Quest — no permission prompt needed
            activateTracking();
        }
    }
</script>
</body>
</html>
