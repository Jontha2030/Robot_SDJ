<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPV View</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; display: flex; 
               justify-content: center; align-items: center; 
               height: 100vh; flex-direction: column; }
        #stream { width: 100%; max-width: 960px; }
        #status { color: white; font-size: 14px; margin-top: 10px; }
        #startBtn { 
            margin-top: 20px; padding: 15px 30px;
            font-size: 18px; background: #4CAF50; 
            color: white; border: none; border-radius: 8px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img id="stream" src="/video" alt="Camera Feed">
    <div id="status">Head tracking: OFF</div>
    <button id="startBtn" onclick="startTracking()">Start Head Tracking</button>

<script>
    const PI_IP = window.location.hostname;  // automatically uses Pi's IP
    let ws = null;
    let xrSession = null;
    let refSpace = null;

    // Convert quaternion to Euler angles (yaw/pitch)
    function quatToEuler(q) {
        const yaw = Math.atan2(
            2 * (q.w * q.y + q.z * q.x),
            1 - 2 * (q.y * q.y + q.z * q.z)
        ) * (180 / Math.PI);

        const pitch = Math.asin(
            Math.max(-1, Math.min(1, 2 * (q.w * q.x - q.y * q.z)))
        ) * (180 / Math.PI);

        return { yaw, pitch };
    }

    async function startTracking() {
        console.log("Starting Tracking")
        // Connect WebSocket
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${PI_IP}:5000/headtracking`);
        ws.onopen  = () => {
            console.log("Websocket connected");
            document.getElementById('status').textContent 
                          = 'Head tracking: CONNECTED';
            ws.send(JSON.stringify({ yaw: 0}));
            ws.send(JSON.stringify({ yaw: 100}))};
        ws.onerror = (e) => {
            console.log("WebSocket error:", e)
            document.getElementById('status').textContent = "Head tracking: CONNECTED"
        }
        ws.onclose = () => {
            console.log("WebSocket closed");
            document.getElementById('status').textContent 
                          = 'Head tracking: DISCONNECTED';}

        console.log("navigator.xr = ", navigator.xr)
        // Request VR session for head rotation data
        if (navigator.xr) {
            try {
                xrSession = await navigator.xr.requestSession('immersive-vr');
                refSpace  = await xrSession.requestReferenceSpace('local');

                xrSession.requestAnimationFrame(function onFrame(time, frame) {
                    console.log("XR frame running");
                    const pose = frame.getViewerPose(refSpace);
                    if (!pose){
                        console.log("No XR pose");
                    };
                    if (pose && ws.readyState === WebSocket.OPEN) {
                        const orientation = pose.transform.orientation;
                        const { yaw, pitch } = quatToEuler(orientation);

                        console.log("Sending yaw:", yaw);
                        ws.send(JSON.stringify({ yaw }));
                    }
                    xrSession.requestAnimationFrame(onFrame);
                });

                document.getElementById('startBtn').textContent = 'Tracking Active';
                document.getElementById('startBtn').disabled = true;

            } catch (e) {
                // Fallback: use device orientation (works without full VR mode)
                document.getElementById('status').textContent 
                    = 'Using device orientation (no VR)';
                window.addEventListener('deviceorientation', (e) => {
                    if (ws.readyState === WebSocket.OPEN) {
                        let yaw = e.alpha || 0;
                        if(yaw > 180) yaw -= 360;
                        ws.send(JSON.stringify({ yaw }));
                    }
                });
            }
        }
    }
</script>
</body>
</html>
