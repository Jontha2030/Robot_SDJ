<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPV View</title>
    <!-- Hér koma grófar stíleseringar -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; display: flex; 
               justify-content: center; align-items: center; 
               height: 100vh; flex-direction: column; }
        #stream { width: 100%; max-width: 960px; }
        #status { color: white; font-size: 14px; margin-top: 10px; font-family: sans-serif; }
        #log    { color: yellow; font-size: 12px; margin-top: 10px; font-family: monospace; 
                  max-width: 960px; word-wrap: break-word; }
        #startBtn { 
            margin-top: 20px; padding: 15px 30px;
            font-size: 18px; background: #4CAF50; 
            color: white; border: none; border-radius: 8px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Hér eru allir "kubbar" vefsíðunar -->
    <img id="stream" src="/video" alt="Camera Feed"> <!-- Mynda kubburinn þar sem myndir frá Pi myndavél birtast -->
    <div id="status">Head tracking: OFF</div> <!-- Texta kubbur þar sem birt er debug línur frá kóða -->
    <div id="log">Log: waiting...</div> <!-- -II- -->
    <button id="startBtn" onclick="startTracking()">Start Head Tracking</button> <!-- Takki sem á að kveikja á VR gleraugna stýringu (virkar ekki eins og er) -->

<!-- Síðan kemur fullt af Javascript kóða til að forrita virkni í vefsíðu -->
<script>
    let tracking = false;
    let baseYaw = null;  // calibration reference
    let lastSentYaw = null;
    const DEADZONE = 2;  // Höfum ehv. fastar gráður sem þarf að hreyfa haus til þess að við séum ekki að senda allar pínulitlu hreyfingar sem kunna að skynjast

    // Debug skilaboð
    function log(msg) {
        console.log(msg);
        document.getElementById('log').textContent = 'Log: ' + msg;
    }
    // Debug skilaboð
    function setStatus(msg) {
        document.getElementById('status').textContent = 'Head tracking: ' + msg;
    }
    // Hér er fall sem sér um að senda upplýsingarnar úr VR gleraugunum sem við notum síðan til þess að hreyfa servo'a
    function sendYaw(yaw) {
        // Þessi if setning er til þess að sjá til þess að við sendum aðeins þegar að VR gleraugu hreuyfast um meira en 2 gráður
        if (lastSentYaw !== null && Math.abs(yaw - lastSentYaw) < DEADZONE) return;
        lastSentYaw = yaw;

        fetch('/headtracking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ yaw: yaw })
        }).catch(e => log("Send error: " + e.message));
    }
    
    // 
    function handleOrientation(e) {
        if (!tracking) return; // Forrit heldur bara áfram ef tracking er virkt sem gerist ef maður ýtir á takkann á vefsíðuni

        let raw = e.alpha || 0;  // Upplýsingar frá VR gleraugum um hvert viðkomandi er að horfa

        // Hér er sett miðjuna á servo (90°) miðað við þar sem viðkomandi var að horfa þegar hann ýtti á takkann.
        // Það er héðan í frá dregið frá gildunum sem koma beint frá VR gelraugunum
        if (baseYaw === null) {
            baseYaw = raw;
            log("Calibrated. Move your head!");
            return;
        }

        // Hér er reiknað hvert viðkomandi er að horfa miðað við miðju
        let yaw = raw - baseYaw;

        // Breyti bilinu þar sem servo'ar komast bara í 180° 
        if (yaw > 180)  yaw -= 360;
        if (yaw < -180) yaw += 360;

        log("Yaw: " + yaw.toFixed(1) + "°");
        sendYaw(yaw); // Set gildi frá VR gleraugum í fallið sem sendir gögnin á bakenda vefsíðu, sem Pi'inn getur síðan lesið
    }

    function startTracking() {
        // Check til þess að grípa error. Þetta er að athuga hvort "DevicOrientationEvent" eiginleiki gleraugnanna sér virkur
        if (!window.DeviceOrientationEvent) {
            log("Device orientation not supported!");
            return;
        }

        // Check til þess að grípa error. Það eru víst ehv. browser'ar með leyfis vesen
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        activateTracking();
                    } else {
                        log("Permission denied");
                    }
                })
                .catch(e => log("Permission error: " + e));
        } else {
            activateTracking(); // Ef allta sleppur í gegn, er hægt að hefja gagnasendingar
        }
    }

    // Þetta er fallið sem sér um að hlusta á VR gleraugun og kalla á viðeigandi föll til að senda upplýsingar á Pi'inn þegar þau eru hreyfð
    function activateTracking() {
        tracking = true;
        baseYaw = null;  // reset calibration
        window.addEventListener('deviceorientation', handleOrientation); // Þessi event listener er að hlusta á VR gleraugun og sendir gögn á Pi'inn þegar þau hreyfast
        
        setStatus("ACTIVE — look straight ahead to calibrate");
        document.getElementById('startBtn').textContent = 'Tracking Active';
        document.getElementById('startBtn').disabled = true;

        // Hér er tékkað hvort tenging við Pi'inn sé að nást
        fetch('/headtracking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ yaw: 0 })
        }).then(r => r.json())
          .then(d => log("Pi connected: " + JSON.stringify(d)))
          .catch(e => log("Pi connection failed: " + e.message));
    }
</script>
</body>
</html>
