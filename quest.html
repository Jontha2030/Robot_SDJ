<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPV View</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; display: flex; 
               justify-content: center; align-items: center; 
               height: 100vh; flex-direction: column; }
        #stream { width: 100%; max-width: 960px; }
        #status { color: white; font-size: 14px; margin-top: 10px; font-family: sans-serif; }
        #log    { color: yellow; font-size: 12px; margin-top: 10px; font-family: monospace; 
                  max-width: 960px; word-wrap: break-word; }
        #startBtn { 
            margin-top: 20px; padding: 15px 30px;
            font-size: 18px; background: #4CAF50; 
            color: white; border: none; border-radius: 8px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img id="stream" src="/video" alt="Camera Feed">
    <div id="status">Head tracking: OFF</div>
    <div id="log">Log: waiting...</div>
    <button id="startBtn" onclick="startTracking()">Start Head Tracking</button>

<script>
    const PI_IP = window.location.hostname;
    let ws = null;

    function log(msg) {
        console.log(msg);
        document.getElementById('log').textContent = 'Log: ' + msg;
    }

    function setStatus(msg) {
        document.getElementById('status').textContent = 'Head tracking: ' + msg;
    }

    function connectWebSocket(onReady) {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${PI_IP}:5000/headtracking`);

        ws.onopen = () => {
            log("WebSocket connected");
            setStatus("CONNECTED");
            if (onReady) onReady();
        };

        ws.onerror = (e) => {
            log("WebSocket error");
            setStatus("ERROR");
        };

        ws.onclose = () => {
            log("WebSocket closed");
            setStatus("DISCONNECTED");
        };
    }

    function sendYaw(yaw) {
        fetch('/headtracking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ yaw: yaw })
        }).catch(e => log("Send error: " + e));
    }

    function startDeviceOrientation() {
        log("Using device orientation fallback");
        setStatus("DEVICE ORIENTATION");

        // iOS requires permission
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(response => {
                if (response === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            });
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }
    }

    function handleOrientation(e) {
        let yaw = e.alpha || 0;  // 0-360 degrees
        if (yaw > 180) yaw -= 360;  // convert to -180 to 180
        log("Yaw: " + yaw.toFixed(1));
        sendYaw(yaw);
    }

    async function tryWebXR() {
        if (!navigator.xr) {
            log("WebXR not available, using device orientation");
            startDeviceOrientation();
            return;
        }

        const supported = await navigator.xr.isSessionSupported('immersive-vr')
                          .catch(() => false);

        if (!supported) {
            log("immersive-vr not supported, using device orientation");
            startDeviceOrientation();
            return;
        }

        try {
            log("Requesting WebXR session...");
            const session  = await navigator.xr.requestSession('immersive-vr');
            const refSpace = await session.requestReferenceSpace('local');
            log("WebXR session started!");
            setStatus("WebXR ACTIVE");

            session.requestAnimationFrame(function onFrame(time, frame) {
                const pose = frame.getViewerPose(refSpace);
                if (pose) {
                    const q = pose.transform.orientation;
                    const yaw = Math.atan2(
                        2 * (q.w * q.y + q.z * q.x),
                        1 - 2 * (q.y * q.y + q.z * q.z)
                    ) * (180 / Math.PI);

                    log("XR Yaw: " + yaw.toFixed(1));
                    sendYaw(yaw);
                }
                session.requestAnimationFrame(onFrame);
            });

            document.getElementById('startBtn').textContent = 'Tracking Active';
            document.getElementById('startBtn').disabled = true;

        } catch (e) {
            log("WebXR failed: " + e.message + " — using device orientation");
            startDeviceOrientation();
        }
    }

    async function startTracking() {
        log("Button pressed, connecting...");
        tryWebXR();
    }
</script>
</body>
</html>
